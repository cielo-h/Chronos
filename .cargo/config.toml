[target.x86_64-pc-windows-msvc]
rustflags = ["-L", "native=lib/mpv"]

[env]
FFMPEG_DIR = { value = "lib/ffmpeg", relative = true }
FFMPEG_INCLUDE_DIR = { value = "lib/ffmpeg/include", relative = true }
FFMPEG_LIB_DIR = { value = "lib/ffmpeg/lib", relative = true }
LIBCLANG_PATH = "C:/Program Files/LLVM/bin"
BINDGEN_EXTRA_CLANG_ARGS = "--target=x86_64-pc-windows-msvc -fms-compatibility -fms-extensions"