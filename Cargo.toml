[package]
name = "Chronos"
version = "0.1.0"
authors = ["C"]
edition = "2024"

[dependencies]
eframe = { version = "0.34.2", default-features = false, features = ["glow"] }
egui = "0.34.2"
egui_glow = "0.34.2"
egui-phosphor = "0.12.0"
libmpv2 = "5.0.3"
libmpv2-sys = "4.0.1"
single-instance = "0.3.3"
log = "0.4.29"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
arboard = "3.6.1"
ffmpeg-next = "8.1.0"
anyhow = "1.0.102"
chrono = "0.4.44"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
egui_extras = "0.34.2"
rfd = "0.17.2"
gl = "0.14.0"
glow = "0.17.0"
bytemuck = "1.25.0"
dirs = "6.0.0"

[profile.dev]
opt-level = 3

[package.metadata.wix]
eula = false
